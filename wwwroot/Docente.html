<!-- Tabla -->
<div class="container mt-4">
    <h1>Docentes</h1>
    <hr>

    <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#ModalAgregarDocente">
        Agregar
    </button>

    <table class="table table-dark table-striped">
    <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Dni</th>
            <th>Sexo</th>
            <th>Email</th>
            <th></th>
            <th></th>
            <th></th>
        </tr>
    </thead>
    <tbody id="TodosLosDocentes"></tbody>
</table>
</div>

<!-- Modal Crear -->
<div id="ModalAgregarDocente" class="modal fade" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Agregar Docente</h5>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" id="Nombre" class="form-control" placeholder="Ingrese el nombre del docente">
        </div>

        <div class="mb-3">
          <label class="form-label">DNI</label>
          <input type="number" id="Dni" class="form-control" placeholder="Ingrese el DNI del docente">
        </div>

        <div class="mb-3">
          <label class="form-label">Sexo</label>
          <select id="Sexo" class="form-control">
            <option value="">Seleccione</option>
            <option value="1">Masculino</option>
            <option value="2">Femenino</option>
            <option value="3">Otro</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="Email" class="form-control" placeholder="Ingrese el email del docente">
        </div>

        <p id="error" class="text-danger" hidden></p>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="CrearDocente()">Guardar</button>
      </div>

    </div>
  </div>
</div>

<!-- Modal Editar -->
<div id="ModalEditarDocente" class="modal fade" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar Docente</h5>
      </div>

      <div class="modal-body">

        <input type="hidden" id="IdDocenteEditar">

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" id="NombreEditar" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">DNI</label>
          <input type="number" id="DniEditar" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Sexo</label>
          <select id="SexoEditar" class="form-control">
            <option value="">Seleccione</option>
            <option value="1">Masculino</option>
            <option value="2">Femenino</option>
            <option value="3">Otro</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email"  id="EmailEditar" class="form-control" disabled>
        </div>

        <p id="erroreditar" class="text-danger" hidden></p>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="EditarDocente()">Guardar</button>
      </div>

    </div>
  </div>
</div>

<!-- MODAL HISTORIAL -->
<div class="modal fade" id="ModalHistorialDocente" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5 subtitulo-vista">
                    HISTORIAL DE MODIFICACIONES DE DOCENTE
                </h1>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>
            </div>

            <div class="modal-body">
                <table class="table table-bordered table-hover">

                    <thead>
                        <tr>
                            <th class="text-center" scope="col">Fecha edición</th>
                            <th scope="col">Atributo</th>
                            <th scope="col">Valor Anterior</th>
                            <th scope="col">Valor Nuevo</th>
                        </tr>
                    </thead>

                    <tbody id="Tbody-historial-docente"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
