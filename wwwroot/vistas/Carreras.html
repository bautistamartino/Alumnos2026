<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carreras</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/Style.css">
</head>
<body class="bg1">


<div id="navbar"></div>

<!-- Tabla -->
<div class="container mt-4">
    <h1>Carreras</h1>
    <hr>
      <!-- BOTÓN -->
    <button class="btn btn-success mb-3"
            onclick="AbrirModalCrearCarrera()">
        Agregar
    </button>


    <table class="table table-dark table-striped">
        <thead>
            <tr>
                <th>Id</th>
                <th>Descripcion</th>
                <th>Duración (años)</th>
                <th></th>
                <th></th>
            </tr>
        </thead>
        <tbody id="TodasLasCarreras"></tbody>
    </table>
</div>

<!-- MODAL -->
<div class="modal fade" id="ModalCarrera" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content text-dark">
            <div class="modal-header">
                <h5 id="TituloModalCarrera">
                    Crear Carrera
                </h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
                <div class="modal-body">
                    <input type="hidden" id="CarreraId">

                    <label class="form-label">Descripción</label>
                    <input type="text" id="DescripcionCarrera" class="form-control">

                    <label class="form-label mt-3">Duración (años)</label>
                    <input type="number" id="DuracionCarrera" class="form-control" min="1" step="1">
                </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary" onclick="GuardarCarrera()">Guardar</button>
            </div>
        </div>
    </div>
</div>


<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/Carrera.js"></script>
<script>
    window.onload = ObtenerCarreras;
</script>

<script>
fetch("componentes/navbar.html")
.then(response => response.text())
.then(data => {
    document.getElementById("navbar").innerHTML = data;
});
</script>

</body>
</html>
