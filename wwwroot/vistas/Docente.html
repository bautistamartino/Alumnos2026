<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docentes</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/Style.css">
</head>

<body class="bg1">

<div id="navbar"></div>

<!-- Tabla -->
<div class="container mt-4">
    <h1>Docentes</h1>
    <hr>

      <!-- BOTÓN -->
      <button class="btn btn-success mb-3" onclick="AbrirModalCrearDocente()">Agregar</button>

    <table class="table table-dark table-striped">
    <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Dni</th>
            <th>Sexo</th>
            <th>Email</th>
            <th></th>
            <th></th>
            <th></th>
            <th>Asignaturas</th>
        </tr>
    </thead>
    <tbody id="TodosLosDocentes"></tbody>
</table>
</div>

<!-- MODAL ASIGNATURAS DEL DOCENTE -->
<div class="modal fade" id="ModalAsignaturasDocente" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content text-dark">
            <div class="modal-header">
                <h5 class="modal-title">Asignaturas a cargo de <span id="NombreDocenteAsignaturas"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="DocenteAsignaturasId">
                <div class="input-group mb-3">
                    <select id="AsignaturaParaDocente" class="form-select">
                        <option value="">Seleccione una asignatura</option>
                    </select>
                    <button class="btn btn-primary" type="button" onclick="AgregarAsignaturaDocente()">Agregar</button>
                </div>

                <table class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>Asignatura</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="AsignaturasDelDocente"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>



<!-- MODAL -->
<div class="modal fade" id="ModalDocente" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content text-dark">
            <div class="modal-header">
                <h5 id="TituloModalDocente">
                    Crear Docente
                </h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="DocenteId">

                <label class="form-label">Nombre</label>
                <input type="text" id="Nombre" class="form-control">

                <label class="form-label mt-2">DNI</label>
                <input type="text" id="Dni" class="form-control">

                <label class="form-label mt-2">Sexo</label>
                <select id="Sexo"
                        class="form-control">
                    <option value="">Seleccione</option>
                    <option value="1">Masculino</option>
                    <option value="2">Femenino</option>
                    <option value="3">Otro</option>
                </select>

                <label class="form-label mt-2">Email</label>
                <input type="email" id="Email" class="form-control">
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>

                <button class="btn btn-primary" onclick="GuardarDocente()">Guardar</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL HISTORIAL -->
<div class="modal fade" id="ModalHistorialDocente" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5 subtitulo-vista">
                    HISTORIAL DE MODIFICACIONES DE DOCENTE
                </h1>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>
            </div>

            <div class="modal-body">
                <table class="table table-bordered table-hover">

                    <thead>
                        <tr>
                            <th class="text-center" scope="col">Fecha edición</th>
                            <th scope="col">Atributo</th>
                            <th scope="col">Valor Anterior</th>
                            <th scope="col">Valor Nuevo</th>
                        </tr>
                    </thead>

                    <tbody id="Tbody-historial-docente"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/Docente.js"></script>

<script>
    window.onload = ObtenerDocentes;
</script>

<script>
fetch("componentes/navbar.html")
.then(response => response.text())
.then(data => {
    document.getElementById("navbar").innerHTML = data;
});
</script>

</body>
</html>
