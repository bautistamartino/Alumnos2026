<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link rel="stylesheet" href="../../css/Style.css">
</head>
<body>
<section class="sectionlogin">
    <div class="login-container">

        <div class="login-card">

            <h1>Crear Cuenta</h1>
            <p class="subtitulo">Complete los datos para registrarse</p>

            <form>

                <div class="campo">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Juan Pérez" required>
                </div>

                <div class="campo">
                    <label for="gmail">Correo Electrónico</label>
                    <input type="email" id="gmail" placeholder="ejemplo@gmail.com" required>
                </div>

                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Nombre de usuario" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>

                <div class="campo">
                    <label for="confirmarPassword">Confirmar Contraseña</label>
                    <input type="password" id="confirmarPassword" placeholder="********" required>
                </div>

                <button type="submit" class="btn-login">
                    Registrarse
                </button>

                <div class="enlaces">
                    <p>¿Ya tienes cuenta?</p>
                    <a href="Login.html">Iniciar Sesión</a>
                </div>

            </form>

        </div>

    </div>
</section>
</body>
</html>
