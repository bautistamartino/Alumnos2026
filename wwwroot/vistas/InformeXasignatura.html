<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas Alumnos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/Style.css">
</head>

<body class="bg1">

<div id="navbar"></div>

<!-- Filtros -->
 <div class="p-3 mb-2 bg-dark text-dark">
    <div class="row">
        <div class="col-md-2 mb-2">
            <label class="control-label">Desde</label>
            <input class="form-control form-control-sm" type="date" id="FechaDesdeBuscar">
        </div>
        <div class="col-md-2 mb-2">
            <label class="control-label">Hasta</label>
            <input class="form-control form-control-sm" type="date" id="FechaHastaBuscar">
        </div>
        <div class="col-md-4 mb-2">
            <label class="control-label">Asignatura</label>
            <select class="form-control form-control-sm" id="selectAsignatura"></select>
        </div>
        <div class="col-md-4 mb-2">
            <label class="control-label">Alumnos</label>
            <select class="form-control form-control-sm" id="selectAlumno"></select>
        </div>
    </div>
 </div>

<!-- Tabla -->
<div class="container mt-4">
    <h1>Lista promedios Asignaturas</h1>
    <hr>

    <div class="table-responsive">
        <table class="table table-bordered table-dark table-striped table-sm" id="tablaasignatura" width="100%" cellspacing="0">
            <thead>
                <tr>
                    <th>Asignatura</th>
                    <th class="text-center" style="width: 100px;">Promedio</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
</div>




<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/InformeXasignatura.js"> </script>

<script>
fetch("componentes/navbar.html")
.then(response => response.text())
.then(data => {
    document.getElementById("navbar").innerHTML = data;
});
</script>

</body>
</html>
